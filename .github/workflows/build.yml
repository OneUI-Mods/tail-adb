name: Android release build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358"
          log-accepted-android-sdk-licenses: false
      - run: python3 tools/test-native.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise the real policy in the disposable Linux runner
        run: sudo -n bash tools/test-linux-integration.sh
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
